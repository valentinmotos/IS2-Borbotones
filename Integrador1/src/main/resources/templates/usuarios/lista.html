<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Zero | Usuarios</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="/cozastore/images/icons/favicon.png">
    <link rel="stylesheet" href="/cozastore/vendor/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/cozastore/fonts/font-awesome-4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="/cozastore/vendor/animsition/css/animsition.min.css">
    <link rel="stylesheet" href="/cozastore/css/util.css">
    <link rel="stylesheet" href="/cozastore/css/main.css">
</head>
<body class="animsition bg-light">
<header class="bg-white border-bottom fixed-top">
    <nav class="navbar navbar-expand-lg container py-3">
        <a class="navbar-brand" th:href="@{/inicio}">
            <img src="/cozastore/images/icons/logo-01.png" alt="Zero" height="24">
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navegacion"
                aria-controls="navegacion" aria-expanded="false" aria-label="Abrir navegación">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div id="navegacion" class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto gap-lg-3">
                <li class="nav-item"><a class="nav-link" th:href="@{/inicio}">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/productos}">Productos</a></li>
                <li class="nav-item"><a class="nav-link active" aria-current="page" th:href="@{/usuarios}">Usuarios</a></li>
            </ul>
        </div>
    </nav>
</header>

<main class="container p-t-120 p-b-80">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
        <div>
            <p class="stext-107 cl6 mb-1">Administración</p>
            <h1 class="mtext-111 cl2">Gestión de usuarios</h1>
        </div>
        <a class="btn text-white bg1 hov-btn1 px-4 py-2" th:href="@{/usuarios/nuevo}">
            <i class="fa fa-plus me-2" aria-hidden="true"></i>Crear usuario
        </a>
    </div>

    <div th:if="${exito}" class="alert alert-success" role="alert" th:text="${exito}"></div>
    <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>

    <section class="bg-white rounded shadow-sm p-3 p-md-4">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th scope="col">Nombre de usuario</th>
                    <th scope="col">Rol</th>
                    <th scope="col" class="text-end">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(usuarios)}">
                    <td colspan="3" class="text-center text-secondary py-5">No hay usuarios activos.</td>
                </tr>
                <tr th:each="usuario : ${usuarios}">
                    <td class="fw-semibold" th:text="${usuario.nombreUsuario}"></td>
                    <td><span class="badge text-bg-secondary" th:text="${usuario.rol}"></span></td>
                    <td>
                        <div class="d-flex flex-wrap justify-content-end gap-2">
                            <a class="btn btn-sm btn-outline-secondary"
                               th:href="@{/usuarios/editar/{id}(id=${usuario.id})}">Editar</a>
                            <a class="btn btn-sm btn-outline-secondary"
                               th:href="@{/usuarios/{id}/clave(id=${usuario.id})}">Cambiar clave</a>
                            <form th:action="@{/usuarios/baja/{id}(id=${usuario.id})}" method="post">
                                <button class="btn btn-sm btn-outline-danger" type="submit">Dar de baja</button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>

<footer class="bg3 py-4">
    <div class="container text-center">
        <p class="stext-107 cl6 mb-0">
            Copyright &copy;<span th:text="${#dates.year(#dates.createNow())}">2026</span> Zero |
            Template by <a class="cl6 hov-cl1" href="https://colorlib.com" target="_blank" rel="noopener">Colorlib</a>
            &amp; distributed by <a class="cl6 hov-cl1" href="https://themewagon.com" target="_blank" rel="noopener">ThemeWagon</a>
        </p>
    </div>
</footer>

<script src="/cozastore/vendor/jquery/jquery-3.2.1.min.js"></script>
<script src="/cozastore/vendor/animsition/js/animsition.min.js"></script>
<script src="/cozastore/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/cozastore/js/main.js"></script>
</body>
</html>
