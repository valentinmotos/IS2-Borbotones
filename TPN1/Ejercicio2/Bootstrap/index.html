<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Empleados</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h2 class="text-center mb-4">Gestión de Empleados</h2>

    <div class="card p-4 mb-4 shadow-sm">
        <form id="employeeForm">
            <input type="hidden" id="editIndex" value="-1">
            <div class="row">
                <div class="col-md-5">
                    <input type="text" id="name" class="form-control" placeholder="Nombre" required>
                </div>
                <div class="col-md-5">
                    <input type="text" id="dept" class="form-control" placeholder="Departamento" required>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary w-100" id="btnSave">Guardar</button>
                </div>
            </div>
        </form>
    </div>

    <table class="table table-striped table-hover bg-white shadow-sm">
        <thead class="table-dark">
            <tr>
                <th>Nombre</th>
                <th>Departamento</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="employeeTable">
        </tbody>
    </table>
</div>

<script src="app.js"></script>
</body>
</html>
