spring.application.name=videojuegos-seguro

# Los secretos y datos de conexion se reciben por variables de entorno.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/videojuegos?useUnicode=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# HTTPS local. Ver HTTPS.md para generar el certificado de desarrollo.
server.ssl.enabled=${SSL_ENABLED:true}
server.ssl.key-store=${SSL_KEY_STORE:classpath:keystore.p12}
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${SSL_KEY_STORE_PASSWORD:changeit}
server.ssl.key-alias=${SSL_KEY_ALIAS:videojuegos-local}
server.port=${SERVER_PORT:8443}
server.forward-headers-strategy=framework
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax

# Carga defensiva de imagenes
app.imagenes.directorio=${VIDEOJUEGOS_IMAGE_DIR:C:/Videojuegos/imagenes}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# No exponer detalles internos en las respuestas de error.
server.error.include-message=never
server.error.include-stacktrace=never
