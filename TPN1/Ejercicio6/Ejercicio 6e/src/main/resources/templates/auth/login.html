<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css"
          integrity="sha384-B0vP5xmATw1+K9KRQjQERJvTumQW0nPEzvF6L/Z6nronJ3oUOFUFpCjEUQouq2+l" crossorigin="anonymous">
    <title>Ingresar - Videojuegos</title>
</head>
<body>
<nav th:replace="~{components/navbar :: nav_bar}"></nav>
<main class="container">
    <div class="row mt-5">
        <div class="col-12 col-md-6 offset-md-3">
            <div class="card shadow-sm">
                <div class="card-header"><h4>Ingresar</h4></div>
                <div class="card-body">
                    <div class="alert alert-danger" th:if="${param.error}">Email o contrasena incorrectos.</div>
                    <div class="alert alert-success" th:if="${param.logout}">La sesion se cerro correctamente.</div>
                    <div class="alert alert-success" th:if="${param.registro}">Cuenta creada. Ya podes ingresar.</div>
                    <form th:action="@{/login}" method="post">
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input id="email" name="email" type="email" class="form-control" maxlength="254"
                                   autocomplete="username" required autofocus>
                        </div>
                        <div class="form-group">
                            <label for="password">Contrasena</label>
                            <input id="password" name="password" type="password" class="form-control"
                                   autocomplete="current-password" required>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block">Ingresar</button>
                    </form>
                    <p class="mt-3 mb-0">¿No tenes cuenta? <a th:href="@{/registro}">Registrate</a>.</p>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
