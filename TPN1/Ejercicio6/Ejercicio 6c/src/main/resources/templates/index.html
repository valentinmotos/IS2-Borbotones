<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Biblioteca | Catálogo</title><link rel="stylesheet" href="/css/app.css"></head><body><header class="topbar"><a class="brand" href="/">BIBLIOTECA<span> / 06C</span></a><div class="session"><span sec:authentication="name"></span><form method="post" th:action="@{/logout}"><button class="link-button">Salir</button></form></div></header><main class="shell"><section class="hero"><div><span class="eyebrow">CATÁLOGO ACTIVO</span><h1>Historias que<br><em>dejan huella.</em></h1></div><div class="hero-note"><strong th:text="${#lists.size(libros)}">0</strong><span>títulos<br>disponibles</span></div></section><p th:if="${error}" class="alert" th:text="${error}"></p><section class="content-grid"><div><div class="section-head"><h2>Libros</h2><span>Inventario en tiempo real</span></div><div class="book-list"><article class="book" th:each="libro : ${libros}" th:if="${libro.alta}"><div class="book-cover" th:text="${#strings.substring(libro.titulo,0,1)}">C</div><div class="book-info"><h3 th:text="${libro.titulo}">Título</h3><p th:text="${libro.autor.nombre + ' · ' + libro.editorial.nombre}">Autor · Editorial</p><small th:text="${libro.anio + '  /  ISBN ' + libro.isbn}"></small></div><div class="availability"><b th:text="${libro.disponibles}">0</b><span>disponibles</span><form method="post" th:action="@{/prestamos}"><input type="hidden" name="libroId" th:value="${libro.id}"><button class="button small" type="submit" th:disabled="${libro.disponibles == 0}">Solicitar</button></form></div></article></div></div><aside><div class="panel"><div class="section-head"><h2>Mis préstamos</h2></div><div class="loan" th:each="prestamo : ${prestamos}" th:if="${prestamo.usuario.mail == #authentication.name}"><b th:text="${prestamo.libro.titulo}">Libro</b><span th:text="${prestamo.fechaPrestamo}">Fecha</span><form method="post" th:action="@{/prestamos/{id}/devolver(id=${prestamo.id})}"><button class="link-button" type="submit">Devolver</button></form></div><p class="muted" th:if="${#lists.isEmpty(prestamos)}">No hay préstamos activos.</p></div><div class="panel admin" sec:authorize="hasRole('ADMIN')"><div class="section-head"><h2>Administración</h2><span>Solo admin</span></div><form method="post" th:action="@{/admin/autores}"><label>Nuevo autor<input name="nombre" required placeholder="Nombre completo"></label><button class="button small" type="submit">Agregar autor</button></form><form method="post" th:action="@{/admin/editoriales}"><label>Nueva editorial<input name="nombre" required placeholder="Nombre"></label><button class="button small" type="submit">Agregar editorial</button></form><form method="post" th:action="@{/admin/libros}"><label>Título<input name="titulo" required></label><div class="two"><label>ISBN<input name="isbn" required></label><label>Año<input name="anio" type="number" min="0" required></label></div><label>Ejemplares<input name="ejemplares" type="number" min="1" required></label><div class="two"><label>Autor<select name="autorId" required><option th:each="autor : ${autores}" th:value="${autor.id}" th:text="${autor.nombre}"></option></select></label><label>Editorial<select name="editorialId" required><option th:each="editorial : ${editoriales}" th:value="${editorial.id}" th:text="${editorial.nombre}"></option></select></label></div><button class="button primary" type="submit">Publicar libro</button></form></div></aside></section></main></body></html>
