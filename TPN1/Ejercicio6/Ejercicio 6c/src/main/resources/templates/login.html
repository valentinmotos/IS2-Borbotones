<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Acceso | Biblioteca</title><link rel="stylesheet" href="/css/app.css"></head><body class="access"><main class="access-card"><span class="eyebrow">BIBLIOTECA SEGURA</span><h1>Tu catálogo,<br><em>siempre cerca.</em></h1><p>Ingresa para consultar libros y gestionar tus préstamos.</p><form method="post" th:action="@{/login}"><label>Correo<input type="email" name="username" required autofocus></label><label>Contraseña<input type="password" name="password" required></label><button class="button primary" type="submit">Ingresar</button></form><p th:if="${param.error}" class="alert">Correo o contraseña incorrectos.</p><p th:if="${param.logout}" class="notice">Sesión cerrada.</p><a href="/registro">Crear una cuenta</a></main></body></html>
