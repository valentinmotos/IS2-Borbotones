<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Registro | Biblioteca</title><link rel="stylesheet" href="/css/app.css"></head><body class="access"><main class="access-card"><span class="eyebrow">NUEVO LECTOR</span><h1>Únete a la<br><em>biblioteca.</em></h1><form method="post" th:action="@{/registro}" th:object="${usuario}"><label>Nombre<input th:field="*{nombre}" required></label><label>DNI<input th:field="*{dni}" required></label><label>Correo<input type="email" th:field="*{mail}" required></label><label>Contraseña<input type="password" th:field="*{clave}" required minlength="6"></label><button class="button primary" type="submit">Registrarme</button></form><p th:if="${error}" class="alert" th:text="${error}"></p><a href="/login">Ya tengo una cuenta</a></main></body></html>
