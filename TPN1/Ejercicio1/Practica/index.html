<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejemplo Basico HTML Semantico</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Mi Pagina Web</h1>
        <p>Este es un texto con letra <b>negrita</b> y también <i>cursiva</i>.</p>
        <nav>
            <a href="https://www.google.com">Visitar Google</a>
        </nav>
        <div class="badge">Nuevo</div>
    </header>

    <main class="grid-container">
        <section class="caja-1">
            <h2>Lista de Tareas</h2>
            <ul>
                <li>Aprender HTML</li>
                <li>Practicar programacion</li>
            </ul>
        </section>

        <section class="caja-2">
            <h2>Tabla de Usuarios</h2>
            <table border="1">
                <tr>
                    <th>Nombre</th>
                    <th>Edad</th>
                </tr>
                <tr>
                    <td>Ana</td>
                    <td>25</td>
                </tr>
                <tr>
                    <td>Carlos</td>
                    <td>30</td>
                </tr>
            </table>
        </section>

        <article class="caja-3 animada">
            <h2>Imagen</h2>
            <img src="https://via.placeholder.com/150" alt="Imagen de ejemplo">
        </article>

        <section class="caja-4">
            <h2>Formulario de Contacto</h2>
            <form class="flex-form">
                <label>Nombre:</label>
                <input type="text">
                <button type="submit">Enviar</button>
            </form>
        </section>
    </main>

    <footer>
        <p>Derechos reservados</p>
    </footer>
</body>
</html>
