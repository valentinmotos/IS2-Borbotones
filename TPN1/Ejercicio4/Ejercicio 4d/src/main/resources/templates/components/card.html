<div th:fragment="_card" class="card my-2 shadow-sm h-100">
    <img th:src="@{'/imagenes/'} + ${videojuego.imagen}" class="card-img-top" alt="imagen videojuego"
         style="height:180px; object-fit:cover;">
    <div class="card-body d-flex flex-column">
        <h5 class="card-title" th:text="${videojuego.titulo}">Título</h5>
        <p class="card-text text-muted mb-1" th:text="${videojuego.categoria.nombre}">Categoría</p>
        <p class="card-text mb-1"><strong>$<span th:text="${videojuego.precio}">0</span></strong></p>
        <div class="mt-auto d-flex gap-2">
            <a th:href="@{/consultarVideojuego(id=${videojuego.id})}" class="btn btn-primary btn-sm flex-fill">Ver</a>
            <a th:href="@{/modificarVideojuego(id=${videojuego.id})}" class="btn btn-warning btn-sm flex-fill">Editar</a>
            <a th:href="@{/bajaVideojuego(id=${videojuego.id})}" class="btn btn-danger btn-sm flex-fill">Baja</a>
        </div>
    </div>
</div>
