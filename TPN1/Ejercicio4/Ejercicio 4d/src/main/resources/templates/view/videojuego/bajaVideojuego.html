<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css"
          integrity="sha384-B0vP5xmATw1+K9KRQjQERJvTumQW0nPEzvF6L/Z6nronJ3oUOFUFpCjEUQouq2+l" crossorigin="anonymous">
    <title>Baja Videojuego</title>
</head>
<body>
<nav th:replace="~{components/navbar :: nav_bar}"></nav>
<div class="container">
    <div class="row mt-5">
        <div class="col-12 col-md-6 offset-md-3">
            <div class="card shadow-sm border-danger">
                <div class="card-header bg-danger text-white">
                    <h5 class="mb-0">Confirmar Baja</h5>
                </div>
                <div class="card-body text-center">
                    <p class="lead">¿Está seguro de dar de baja al videojuego?</p>
                    <h4 th:text="${videojuego.titulo}" class="mb-3"></h4>
                    <form th:action="@{/bajaVideojuego(id=${videojuego.id})}" method="post">
                        <div class="d-flex justify-content-center gap-3">
                            <button class="btn btn-danger mr-2" type="submit">Sí, dar de baja</button>
                            <a class="btn btn-secondary" th:href="@{/inicio}">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"
        integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-Piv4xVNRyMGpqkS2by6br4gNJ7DXjqk09RmUpJ8jgGtD7zP9yug3goQfGII0yAns" crossorigin="anonymous"></script>
</body>
</html>
