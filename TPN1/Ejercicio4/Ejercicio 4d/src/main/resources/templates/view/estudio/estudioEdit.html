<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css"
          integrity="sha384-B0vP5xmATw1+K9KRQjQERJvTumQW0nPEzvF6L/Z6nronJ3oUOFUFpCjEUQouq2+l" crossorigin="anonymous">
    <title>Estudio</title>
</head>
<body>
<nav th:replace="components/navbar :: nav_bar"></nav>
<div class="container">
    <div class="row mt-4">
        <div class="col-12 col-md-6 offset-md-3">
            <div class="card shadow-sm">
                <div class="card-header">
                    <h5 th:if="${modo == 'alta'}">Nuevo Estudio</h5>
                    <h5 th:if="${modo == 'modificar'}">Modificar Estudio</h5>
                    <h5 th:if="${modo == 'consulta'}">Consultar Estudio</h5>
                </div>
                <div class="card-body">

                    <!-- Alta -->
                    <form th:if="${modo == 'alta'}"
                          th:action="@{/altaEstudio}" method="post" th:object="${estudio}">
                        <div class="form-group">
                            <label for="nombre">Nombre:</label>
                            <input type="text" class="form-control" id="nombre" th:field="*{nombre}" placeholder="Nombre del estudio">
                        </div>
                        <div class="d-flex justify-content-between mt-3">
                            <a th:href="@{/estudios}" class="btn btn-outline-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-success">Guardar</button>
                        </div>
                    </form>

                    <!-- Modificar -->
                    <form th:if="${modo == 'modificar'}"
                          th:action="@{/estudio/aceptarEditEstudio}" method="post" th:object="${estudio}">
                        <input type="hidden" th:field="*{id}">
                        <div class="form-group">
                            <label for="nombreMod">Nombre:</label>
                            <input type="text" class="form-control" id="nombreMod" th:field="*{nombre}">
                        </div>
                        <div class="d-flex justify-content-between mt-3">
                            <a th:href="@{/estudios}" class="btn btn-outline-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-warning">Actualizar</button>
                        </div>
                    </form>

                    <!-- Consulta (solo lectura) -->
                    <form th:if="${modo == 'consulta'}" th:object="${estudio}">
                        <fieldset disabled>
                            <div class="form-group">
                                <label>ID:</label>
                                <input type="text" class="form-control" th:field="*{id}">
                            </div>
                            <div class="form-group">
                                <label>Nombre:</label>
                                <input type="text" class="form-control" th:field="*{nombre}">
                            </div>
                            <div class="form-group">
                                <label>Activo:</label>
                                <input type="checkbox" th:field="*{activo}">
                            </div>
                        </fieldset>
                        <div class="mt-3">
                            <a th:href="@{/estudios}" class="btn btn-primary">Volver</a>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"
        integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-Piv4xVNRyMGpqkS2by6br4gNJ7DXjqk09RmUpJ8jgGtD7zP9yug3goQfGII0yAns" crossorigin="anonymous"></script>
</body>
</html>
