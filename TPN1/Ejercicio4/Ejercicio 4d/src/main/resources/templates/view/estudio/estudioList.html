<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css"
          integrity="sha384-B0vP5xmATw1+K9KRQjQERJvTumQW0nPEzvF6L/Z6nronJ3oUOFUFpCjEUQouq2+l" crossorigin="anonymous">
    <title>Estudios</title>
</head>
<body>
<nav th:replace="~{components/navbar :: nav_bar}"></nav>
<div class="container">
    <div class="row my-4">
        <div class="col-6">
            <h3>Estudios</h3>
        </div>
        <div class="col-6 d-flex flex-row-reverse">
            <a th:href="@{/altaEstudio}" class="btn btn-success">+ Nuevo Estudio</a>
        </div>
    </div>
    <div class="row">
        <div class="col-12">
            <div class="alert alert-info" th:if="${#lists.isEmpty(estudios)}">
                No hay estudios registrados.
            </div>
            <table class="table table-bordered table-hover" th:unless="${#lists.isEmpty(estudios)}">
                <thead class="thead-dark">
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Activo</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="estudio : ${estudios}"
                    th:classappend="${estudio.activo} ? '' : 'table-secondary'">
                    <td th:text="${estudio.id}"></td>
                    <td th:text="${estudio.nombre}"></td>
                    <td>
                        <span th:if="${estudio.activo}" class="badge badge-success">Activo</span>
                        <span th:unless="${estudio.activo}" class="badge badge-secondary">Inactivo</span>
                    </td>
                    <td>
                        <a th:href="@{/consultarEstudio(id=${estudio.id})}" class="btn btn-info btn-sm">Ver</a>
                        <a th:href="@{/modificarEstudio(id=${estudio.id})}" class="btn btn-warning btn-sm">Editar</a>
                        <a th:if="${estudio.activo}" th:href="@{/bajaEstudio(id=${estudio.id})}"
                           class="btn btn-danger btn-sm"
                           onclick="return confirm('¿Dar de baja este estudio?')">Baja</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"
        integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-Piv4xVNRyMGpqkS2by6br4gNJ7DXjqk09RmUpJ8jgGtD7zP9yug3goQfGII0yAns" crossorigin="anonymous"></script>
</body>
</html>
