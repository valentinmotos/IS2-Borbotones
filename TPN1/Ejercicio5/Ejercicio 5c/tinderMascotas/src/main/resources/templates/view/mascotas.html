<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Find your new best friend</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
          rel="stylesheet">

</head>


<body class="bg-gray-50 min-h-screen">

    <!-- HEADER -->

    <header class="w-full bg-white shadow-sm">

        <div class="max-w-6xl mx-auto px-6 py-5 flex justify-between items-center">

            <h1 class="text-2xl font-bold text-gray-900">
                Find your new best friend
            </h1>

        </div>

    </header>


    <!-- CONTENIDO -->

    <main class="max-w-6xl mx-auto px-6 py-10">


        <!-- TITULO -->

        <div class="mb-8">

            <h2 class="text-xl font-semibold text-gray-900">
                Mascotas
            </h2>

            <p class="text-gray-500 mt-1">
                Selecciona una mascota
            </p>

        </div>


        <!-- LISTADO -->

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">


            <!--
                Thymeleaf recorre la lista enviada
                desde el Controller.
            -->
            <div
                    th:each="mascota : ${mascotas}"
                    class="bg-white rounded-xl overflow-hidden shadow-sm hover:shadow-md transition-shadow">


                <!-- IMAGEN -->

                <div class="relative aspect-square bg-gray-200 overflow-hidden">

                    <img
                            src="https://images.unsplash.com/photo-1552053831-71594a27632d"
                            alt="Pet photo"
                            class="w-full h-full object-cover">

                </div>


                <!-- INFORMACIÓN -->

                <div class="p-5">


                    <!-- NOMBRE -->

                    <h2
                            class="text-lg font-bold text-gray-900"
                            th:text="${mascota.nombre}">

                        Buddy

                    </h2>


                    <!-- SEXO -->

                    <p
                            class="text-gray-500 mt-1"
                            th:text="${mascota.sexo}">

                        M

                    </p>


                    <!-- ACCIONES -->

                    <div class="mt-4 flex items-center gap-2">


                        <!-- LIKE -->

                        <form
                                th:action="@{/votarMascota}"
                                method="POST"
                                class="flex-1">

                            <!-- ID DE LA MASCOTA -->
                            <input
                                    type="hidden"
                                    name="pet_id"
                                    th:value="${mascota.id}">

                            <button
                                    type="submit"

                                    th:disabled="${mascota.like == 'true'}"

                                    th:classappend="${mascota.like == 'true'}
                                        ? ' bg-blue-100 text-blue-600 border-blue-200 cursor-not-allowed'
                                        : ' border-gray-200 text-gray-600 hover:bg-gray-50 hover:text-blue-600'"

                                    class="w-full py-2 rounded-lg border transition-colors flex items-center justify-center gap-2">

                                <span class="material-symbols-outlined">
                                    thumb_up
                                </span>

                                <span
                                        th:text="${mascota.like == 'true' ? 'Ya te gusta' : 'Like'}">

                                    Like

                                </span>

                            </button>

                        </form>


                    </div>

                </div>

            </div>


        </div>


    </main>


    <!-- NAVEGACIÓN INFERIOR -->

    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200">

        <div class="max-w-6xl mx-auto px-6 py-3 flex justify-around">


            <!-- HOME -->

            <a
                    href="#"
                    class="flex flex-col items-center text-gray-700">

                <span class="material-symbols-outlined">
                    home
                </span>

                <span class="text-xs">
                    Home
                </span>

            </a>


            <!-- VOTE -->

            <a
                    href="#"
                    class="flex flex-col items-center text-gray-700">

                <span class="material-symbols-outlined">
                    thumb_up
                </span>

                <span class="text-xs">
                    Vote
                </span>

            </a>


            <!-- SEARCH -->

            <a
                    href="#"
                    class="flex flex-col items-center text-gray-700">

                <span class="material-symbols-outlined">
                    search
                </span>

                <span class="text-xs">
                    Search
                </span>

            </a>


            <!-- PROFILE -->

            <a
                    href="#"
                    class="flex flex-col items-center text-gray-700">

                <span class="material-symbols-outlined">
                    person
                </span>

                <span class="text-xs">
                    Profile
                </span>

            </a>

        </div>

    </nav>

</body>

</html>
