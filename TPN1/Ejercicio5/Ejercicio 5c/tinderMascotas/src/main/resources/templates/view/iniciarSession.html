<body class="bg-background min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop antialiased text-on-surface selection:bg-primary-container selection:text-on-primary-container">
<!-- Login Container -->
<div class="w-full max-w-[440px] z-10">
<!-- Brand Header -->
<div class="text-center mb-lg">
<h1 class="font-display-lg text-display-lg text-primary tracking-tight">Tinder De Mascotas</h1>

</div>
<!-- Card -->
<div class="bg-surface-container-lowest rounded-xl shadow-[0px_10px_30px_rgba(0,0,0,0.08)] p-lg relative overflow-hidden ring-1 ring-surface-variant">
<form action="/iniciarSession" class="space-y-md" method="POST">
<!-- Email Field -->
<div class="space-y-base">
<label class="block font-label-md text-label-md text-on-surface-variant" for="email">Correo electrónico</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined" style="font-size: 20px;">mail</span>
</div>
<input class="block w-full pl-xl pr-sm py-sm bg-surface rounded-lg border-none ring-1 ring-surface-variant focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-all duration-200 font-body-md text-body-md text-on-surface placeholder-outline-variant" id="email" name="email" placeholder="tu@ejemplo.com" required="" type="email">
</div>
</div>
<!-- Password Field -->
<div class="space-y-base">
<div class="flex justify-between items-center">
<label class="block font-label-md text-label-md text-on-surface-variant" for="password">Contraseña</label>

</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined" style="font-size: 20px;">lock</span>
</div>
<input class="block w-full pl-xl pr-xl py-sm bg-surface rounded-lg border-none ring-1 ring-surface-variant focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-all duration-200 font-body-md text-body-md text-on-surface placeholder-outline-variant" id="password" name="password" placeholder="••••••••" required="" type="password">
<button class="absolute inset-y-0 right-0 pr-sm flex items-center text-outline hover:text-on-surface-variant transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined" style="font-size: 20px;">visibility_off</span>
</button>
</div>
</div>
<!-- Remember Me -->

<!-- Submit Button -->
<button class="w-full flex justify-center py-sm px-4 border border-transparent rounded-lg shadow-sm font-label-md text-label-md text-on-primary bg-primary hover:bg-on-primary-fixed-variant focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary active:scale-[0.98] transition-all duration-200 mt-md" type="submit">
                    Iniciar Sesión
                </button>
</form>
<!-- Divider -->

<!-- Social Logins -->

</div>
<!-- Registration Link -->
<p class="mt-lg text-center font-body-md text-body-md text-on-surface-variant">
            ¿Nuevo en Tinder De Mascotas?

</p>
