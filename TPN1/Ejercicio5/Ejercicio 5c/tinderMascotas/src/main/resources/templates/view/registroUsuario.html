<body class="bg-background text-on-background min-h-screen flex flex-col antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Main Content Canvas (Navigation Suppressed for Transactional Intent) -->
<main class="flex-grow flex items-center justify-center p-margin-mobile md:p-margin-desktop relative overflow-hidden my-lg">
<!-- Decorative Ambient Background Elements for Soft Minimalism -->
<!-- Glassmorphism Card Container -->
<div class="w-full max-w-[480px] bg-surface-container-lowest/80 rounded-xl border-surface-variant/50 p-lg relative z-10">
<!-- Header -->
<div class="text-center mb-lg">
<h1 class="font-display-lg text-display-lg text-primary tracking-tight mb-xs">Tinder De Mascotas</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Crea tu cuenta</p>
</div>
<!-- Form -->
<form action="#" class="space-y-lg" method="POST">
<!-- Section: Usuario -->
<div class="space-y-md">
<h2 class="font-headline-md text-headline-md text-on-surface border-b border-surface-variant pb-xs">Usuario</h2>
<!-- Nombre Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="user_name">Nombre</label>
<div class="relative">
<input class="w-full pr-sm py-sm bg-surface rounded-lg border border-surface-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-shadow font-body-md text-body-md text-on-surface placeholder:text-outline-variant placeholder:font-body-md" id="user_name" name="user_name" placeholder="Alex" type="text">
</div>
</div>
<!-- Apellido Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="user_lastname">Apellido</label>
<div class="relative">
<input class="w-full pr-sm py-sm bg-surface rounded-lg border border-surface-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-shadow font-body-md text-body-md text-on-surface placeholder:text-outline-variant placeholder:font-body-md" id="user_lastname" name="user_lastname" placeholder="Taylor" type="text">
</div>
</div>
<!-- Email Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="email">Email</label>
<div class="relative">
<input class="w-full pr-sm py-sm bg-surface rounded-lg border border-surface-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-shadow font-body-md text-body-md text-on-surface placeholder:text-outline-variant placeholder:font-body-md" id="email" name="email" placeholder="alex@ejemplo.com" type="email">
</div>
</div>
<!-- Contraseña Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="password">Contraseña</label>
<div class="relative">
<input class="w-full pr-sm py-sm bg-surface rounded-lg border border-surface-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-shadow font-body-md text-body-md text-on-surface placeholder:text-outline-variant placeholder:font-body-md" id="password" name="password" placeholder="••••••••" type="password">
</div>
</div>
</div>
<!-- Section: Mascota -->
<div class="space-y-md">
<h2 class="font-headline-md text-headline-md text-on-surface border-b border-surface-variant pb-xs">Mascota</h2>
<!-- Nombre Mascota Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="pet_name">Nombre</label>
<div class="relative">
<input class="w-full pr-sm py-sm bg-surface rounded-lg border border-surface-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-shadow font-body-md text-body-md text-on-surface placeholder:text-outline-variant placeholder:font-body-md" id="pet_name" name="pet_name" placeholder="Fido" type="text">
</div>
</div>
<!-- Sexo Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="pet_gender">Sexo</label>
<div class="relative">
<select class="w-full pr-sm py-sm bg-surface rounded-lg border border-surface-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-shadow font-body-md text-body-md text-on-surface" id="pet_gender" name="pet_gender">
    <option value="">Selecciona el sexo</option>
    <option th:each="sexo : ${sexos}"
        th:value="${sexo}"
        th:text="${sexo}">
</option>
</select>
</div>
</div>
<!-- Fecha Alta Field -->

</div>
<!-- Submit Button -->
<button class="w-full py-sm rounded-lg font-label-md text-label-md flex justify-center items-center gap-xs hover:opacity-90 active:scale-[0.98] transition-all duration-200 mt-lg text-primary border border-surface-variant" type="submit">
                    Registrarse
                    
</button>
</form>
<!-- Footer Links -->
<div class="mt-md text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                    ¿Ya tienes cuenta? 
                    <a class="text-primary hover:text-primary-fixed-dim font-label-md text-label-md transition-colors underline-offset-4 hover:underline" href="#">Iniciar sesión</a>
</p>
</div>
</div>
</main>
