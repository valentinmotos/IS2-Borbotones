                        "inverse-primary": "#c0c1ff",

                        "secondary-fixed": "#dae2fd",
                        "tertiary": "#4f5f76",

                        "tertiary-fixed-dim": "#b7c8e1",

                        "on-secondary": "#ffffff",

    <style>

        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
        }

        .card-shadow {
            box-shadow: 0 10px 15px -3px rgba(118, 117, 134, 0.04),
                        0 4px 6px -2px rgba(118, 117, 134, 0.02);
            transition: all 0.3s ease;
        }

        .card-shadow:hover {
            box-shadow: 0 20px 25px -5px rgba(118, 117, 134, 0.08),
                        0 10px 10px -5px rgba(118, 117, 134, 0.04);
            transform: translateY(-2px);
        }

    </style>

<body class="bg-background text-on-surface font-body-md min-h-screen pt-[72px]">


<!-- TopNavBar -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-margin-mobile md:px-margin-desktop py-4 max-w-container-max mx-auto bg-surface/80 backdrop-blur-md shadow-sm">

    <div class="font-display text-headline-md font-extrabold text-primary dark:text-inverse-primary">
        Buscador Videojuegos
    </div>

    <nav class="hidden md:flex gap-gutter">

        <a class="text-primary font-bold border-b-2 border-primary pb-1 hover:opacity-80 transition-opacity"
           href="/exploradorJuegos">

            Explorar

        </a>

    </nav>

    <div class="flex items-center gap-gutter">
    </div>

</header>


<main class="max-w-container-max mx-auto px-margin-mobile md:px-margin-desktop py-64px flex flex-col md:flex-row gap-48px pt-[64px]">

    <!-- Sidebar Filtros -->


    <!-- Catalog Grid -->
    <div class="flex-grow grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-gutter">


        <!--
            Se recorre la lista de videojuegos
            enviada desde el Controller.
        -->
        <article
                th:each="videojuego : ${videojuegos}"
                class="bg-surface-container-lowest rounded-lg overflow-hidden card-shadow flex flex-col group cursor-pointer">


            <div class="relative aspect-[3/4] w-full overflow-hidden bg-surface-variant">


                <!-- Imagen dinámica -->
                <img
                        th:src="@{'/imagenes/' + ${videojuego.imagen}}"
                        th:alt="${videojuego.titulo}"
                        class="absolute inset-0 w-full h-full object-cover">


            </div>


            <div class="p-16 flex flex-col flex-grow">


                <!-- Título dinámico y enlace al detalle -->
                <a th:href="@{/detalleVideoJuego/{id}(id=${videojuego.id})}">

                    <h3
                            class="font-headline-md text-headline-md text-on-surface mb-base leading-tight"
                            th:text="${videojuego.titulo}">

                        Aether Interceptor

                    </h3>

                </a>


                <!-- Descripción dinámica -->
                <p
                        class="font-body-md text-body-md text-on-surface-variant mb-base"
                        th:text="${videojuego.descripcion}">

                    Descripción del videojuego.

                </p>


                <div class="mt-auto pt-16 flex justify-between items-center border-t border-surface-variant">


                    <!-- Precio dinámico -->
                    <span class="font-label-md text-label-md text-primary font-bold">

                        $

                        <span th:text="${videojuego.precio}">
                            59.99
                        </span>

                    </span>

                </div>

            </div>

        </article>

    </div>

</main>


</body>

</html>
