spring.application.name=zero-ecommerce

# Puerto HTTP habitual de la aplicacion
server.port=8080

# Base de datos: SQLite en ./data/zero.db (el directorio lo crea EcommerceApplication.main)
spring.datasource.url=jdbc:sqlite:./data/zero.db?foreign_keys=on
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite admite un solo escritor a la vez: una sola conexión evita errores de "database is locked"
spring.datasource.hikari.maximum-pool-size=1

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update

# Subida de archivos
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# URL pública usada en enlaces e imágenes de correos. En producción debe ser HTTPS.
app.url-base=${APP_URL_BASE:http://localhost:8080}

# Mercado Pago SDK: Access token de prueba y clave secreta del webhook
mercadopago.access-token=${MP_ACCESS_TOKEN:APP_USR-1125880501822374-092203-904f8be1bc8af2ec9f9cb78075cff7f2-3014215549}
mercadopago.webhook-secret=${MP_WEBHOOK_SECRET:81ed3089e15e68582f2d9a323e74cceec949a4f0b9475a9c5c2f1c01e1896c14}

# Newsletter de ofertas (evaluación diaria a las 09:00 de Buenos Aires).
newsletter.archivo-ultimo-envio=data/newsletter-ultimo-envio.txt
newsletter.cron=0 0 9 * * *
newsletter.zona=America/Argentina/Buenos_Aires

# Deteccion diaria de precios con mas de dos meses (09:15 de Buenos Aires).
precios.alertas.cron=0 15 9 * * *
precios.alertas.zona=America/Argentina/Buenos_Aires
