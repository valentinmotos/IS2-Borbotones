<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{email/base}">
<body>
    <div layout:fragment="contenido">
        <h1 style="margin: 0 0 16px 0; font-size: 22px; line-height: 1.3; color: #0b0b0b;">¡La configuración funciona!</h1>
        <p style="margin: 0 0 12px 0;">
            Este es un correo de prueba enviado desde el panel de <strong th:text="${empresa.razonSocial}">Zero</strong>.
        </p>
        <p style="margin: 0 0 12px 0;">
            Si lo estás leyendo en <strong th:text="${destinatario}">correo@ejemplo.com</strong>, la cuenta SMTP quedó bien
            configurada y los próximos correos de la tienda van a salir con este diseño.
        </p>
        <p style="margin: 24px 0 0 0; font-size: 13px; color: #7a7a7a;">No hace falta responder este mensaje.</p>
    </div>
</body>
</html>
