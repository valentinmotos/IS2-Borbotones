<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/publico}">
<body>
        <section layout:fragment="content" class="container py-5">
            <div class="row justify-content-center">
                <div class="col-12 col-md-7 col-lg-5">
                    <div class="card shadow-sm">
                        <div class="card-body p-4 p-md-5">
                            <h1 class="h3 mb-4 text-center">Crear cuenta en Zero</h1>
                            <div th:replace="~{fragments/mensajes :: mensajes}"></div>
                            <form th:action="@{/registro}" method="post" class="zero-form">
                                <div th:replace="~{fragments/formulario :: campoTexto('correo', 'Correo electrónico', ${correo}, true)}"></div>
                                <div th:replace="~{fragments/formulario :: campoClave('clave', 'Contraseña', true, 'Al menos 8 caracteres.')}"></div>
                                <div th:replace="~{fragments/formulario :: campoClave('confirmacion', 'Repetir contraseña', true, null)}"></div>
                                <button type="submit" class="zero-button primary w-100 mt-2">Crear cuenta</button>
                            </form>
                            <p class="text-center mt-4 mb-2">¿Ya tenés cuenta? <a th:href="@{/login}">Ingresá</a></p>
                            <p class="text-center mb-0">¿Te registraste y no activaste la cuenta? <a th:href="@{/registro/activar}">Activala</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
</body>
</html>
