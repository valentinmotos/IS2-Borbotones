<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin}">
<body>
    <div layout:fragment="breadcrumb"><span>Usuarios</span></div>
    <div layout:fragment="content">
        <div th:replace="~{fragments/mensajes :: mensajes}"></div>
        <div class="zero-panel">
            <div class="mb-3"><a th:href="@{/admin/usuarios/nuevo}" class="zero-button primary">Nuevo empleado</a></div>
            <form th:action="@{/admin/usuarios}" method="get" class="zero-filters">
                <div class="form-group"><label for="buscar">Correo</label>
                    <input id="buscar" name="buscar" class="form-control" type="search" th:value="${buscar}" placeholder="Buscar por correo"></div>
                <div class="form-group"><label for="rol">Rol</label>
                    <select id="rol" name="rol" class="form-control"><option th:each="opcion : ${roles}" th:value="${opcion.key}" th:text="${opcion.value}" th:selected="${opcion.key == rol}"></option></select></div>
                <div class="form-group"><label for="estado">Estado</label>
                    <select id="estado" name="estado" class="form-control"><option th:each="opcion : ${estados}" th:value="${opcion.key}" th:text="${opcion.value}" th:selected="${opcion.key == estado}"></option></select></div>
                <div class="zero-filters-acciones"><button class="zero-button primary" type="submit">Filtrar</button><a th:href="@{/admin/usuarios}" class="zero-button secondary">Limpiar</a></div>
            </form>
            <div class="table-responsive">
                <table class="table zero-table"><thead><tr><th>Nombre</th><th>Correo</th><th>Rol</th><th>Estado</th><th>Acciones</th></tr></thead>
                    <tbody><tr th:if="${#lists.isEmpty(usuarios)}"><td colspan="5" class="text-center text-muted py-4">No hay usuarios para mostrar.</td></tr>
                        <tr th:each="usuario : ${usuarios}"><td th:text="${usuario.nombre}"></td><td th:text="${usuario.correo}"></td><td th:text="${usuario.rol}"></td><td th:text="${usuario.estado}"></td>
                            <td class="zero-table-actions"><a th:href="@{/admin/usuarios/{id}(id=${usuario.id})}" class="btn btn-sm btn-outline-secondary">Ver</a>
                                <a th:if="${usuario.empleado and usuario.estado != 'Inactivo'}" th:href="@{/admin/usuarios/{id}/editar(id=${usuario.id})}" class="btn btn-sm btn-outline-primary">Editar</a>
                                <form th:if="${usuario.cliente and usuario.estado == 'Inactivo'}" th:action="@{/admin/usuarios/{id}/reactivar(id=${usuario.id})}" method="post" class="d-inline"><button class="btn btn-sm btn-outline-success" type="submit">Reactivar</button></form>
                                <button th:if="${usuario.estado != 'Inactivo'}" type="button" class="btn btn-sm btn-outline-danger" data-toggle="modal" th:attr="data-target=${'#eliminar-' + usuario.id}">Dar de baja</button></td></tr></tbody>
                </table>
            </div>
        </div>
        <th:block th:each="usuario : ${usuarios}" th:if="${usuario.estado != 'Inactivo'}"><div th:replace="~{fragments/modal-confirmar :: modal(${'eliminar-' + usuario.id}, 'Dar de baja usuario', ${'¿Querés dar de baja la cuenta ' + usuario.correo + '?'}, ${'/admin/usuarios/' + usuario.id + '/eliminar'})}"></div></th:block>
    </div>
</body>
</html>
