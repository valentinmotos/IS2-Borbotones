<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin}">
<body>
    <div layout:fragment="breadcrumb">
        <span>Inicio</span><span class="breadcrumb-separator">/</span><span>Proveedores</span>
    </div>
    <div layout:fragment="content">
        <div th:replace="~{fragments/mensajes :: mensajes}"></div>
        <div class="zero-panel">
            <form th:action="@{/admin/proveedores}" method="get" class="zero-filters mb-4">
                <div th:replace="~{fragments/filtros :: campoFiltroTexto('buscar', 'Buscar', ${buscar}, 'Razón social')}"></div>
                <div class="zero-filters-acciones">
                    <button type="submit" class="zero-button primary">Buscar</button>
                    <a th:href="@{/admin/proveedores}" class="zero-button secondary">Limpiar</a>
                </div>
            </form>
            <div class="d-flex flex-wrap justify-content-between align-items-center mb-3">
                <a th:href="@{/admin/proveedores/nuevo}" class="zero-button primary">Nuevo proveedor</a>
                <span class="text-muted"
                      th:text="${totalProveedores == 1 ? '1 proveedor' : totalProveedores + ' proveedores'}">0 proveedores</span>
            </div>
            <div class="table-responsive zero-table-wrap">
                <table class="table table-striped table-bordered mb-0">
                    <thead>
                        <tr>
                            <th scope="col">Razón Social</th>
                            <th scope="col">Teléfonos</th>
                            <th scope="col">Correos Electrónicos</th>
                            <th scope="col" class="text-center">WhatsApp</th>
                            <th scope="col">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(proveedores)}">
                            <td colspan="5" class="text-center text-muted py-4">No hay proveedores para mostrar.</td>
                        </tr>
                        <tr th:each="proveedor : ${proveedores}">
                            <td>
                                <strong th:text="${proveedor.razonSocial}">Razón Social</strong>
                            </td>
                            <td>
                                <div th:if="${#lists.isEmpty(proveedor.telefonosActivos)}" class="text-muted">-</div>
                                <div th:each="tel : ${proveedor.telefonosActivos}" class="mb-1">
                                    <span class="badge" th:classappend="${tel.tipoTelefono.name() == 'CELULAR' ? 'badge-primary' : 'badge-secondary'}"
                                          th:text="${tel.tipoTelefono.descripcion}">Tipo</span>
                                    <span th:text="${tel.telefono}">Número</span>
                                    <small th:if="${tel.observacion != null}" class="text-muted" th:text="${'(' + tel.observacion + ')'}"></small>
                                </div>
                            </td>
                            <td>
                                <div th:if="${#lists.isEmpty(proveedor.correosActivos)}" class="text-muted">-</div>
                                <div th:each="correo : ${proveedor.correosActivos}" class="mb-1">
                                    <i class="fa fa-envelope-o text-muted mr-1"></i>
                                    <span th:text="${correo.email}">Email</span>
                                    <small th:if="${correo.observacion != null}" class="text-muted" th:text="${'(' + correo.observacion + ')'}"></small>
                                </div>
                            </td>
                            <td class="text-center align-middle">
                                <a th:if="${proveedor.primerCelular != null}"
                                   th:href="@{'https://wa.me/' + ${proveedor.primerCelular}}"
                                   target="_blank" rel="noopener noreferrer"
                                   class="btn btn-sm btn-success"
                                   style="background-color: #25D366; border-color: #25D366; color: white;"
                                   th:title="${'Abrir WhatsApp con ' + proveedor.primerCelular}">
                                    <i class="fa fa-whatsapp"></i> WhatsApp
                                </a>
                                <span th:if="${proveedor.primerCelular == null}" class="text-muted">-</span>
                            </td>
                            <td class="zero-table-actions">
                                <a th:href="@{'/admin/proveedores/' + ${proveedor.id} + '/editar'}" class="btn btn-sm btn-outline-primary"
                                   th:attr="aria-label=${'Editar ' + proveedor.razonSocial}">Editar</a>
                                <button type="button" class="btn btn-sm btn-outline-danger" data-toggle="modal"
                                        th:attr="data-target=${'#eliminar-' + proveedor.id},aria-label=${'Eliminar ' + proveedor.razonSocial}">Eliminar</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <th:block th:each="proveedor : ${proveedores}">
            <div th:replace="~{fragments/modal-confirmar :: modal(${'eliminar-' + proveedor.id}, 'Eliminar proveedor',
                 ${'¿Querés eliminar el proveedor ' + proveedor.razonSocial + '? No se podrán registrar nuevas compras a este proveedor.'},
                 ${'/admin/proveedores/' + proveedor.id + '/eliminar'})}"></div>
        </th:block>
    </div>
</body>
</html>
