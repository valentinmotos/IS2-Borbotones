<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
    <article th:fragment="card(imagen, nombre, precio, enOferta)" class="zero-product-card">
        <div class="image-wrap">
            <img th:src="${imagen}" th:alt="${nombre}">
        </div>
        <div class="zero-product-card-body">
            <span th:if="${enOferta}" class="badge badge-danger zero-offer-badge">Oferta</span>
            <h3 th:text="${nombre}">Producto</h3>
            <span class="price" th:text="${precio}">$0</span>
        </div>
    </article>

    <!-- Card navegable usada por las grillas reales del catalogo. Recibe un ModeloCatalogoDTO: todos los talles
         del modelo en una sola card. Desde el listado no se agrega al carrito: hay que entrar al detalle para
         elegir el talle. -->
    <article th:fragment="cardCatalogo(producto)" class="zero-product-card">
        <a class="zero-product-card-link" th:href="@{/producto/{id}(id=${producto.id})}">
            <div class="image-wrap">
                <span th:if="${producto.enOferta}" class="badge badge-danger zero-offer-badge">Oferta</span>
                <img th:src="${producto.imagenId != null ? '/imagen/' + producto.imagenId : '/img/default-image.png'}"
                     th:alt="${producto.nombre}" loading="lazy">
            </div>
            <div class="zero-product-card-body">
                <h3 th:text="${producto.nombre}">Producto</h3>
                <p class="zero-product-meta"
                   th:text="${(producto.variosTalles ? 'Talles ' : 'Talle ') + #strings.listJoin(producto.talles, ' · ')}">Talle M</p>
                <span class="price" th:text="${producto.precioFormateado}">$0</span>
                <span class="zero-product-card-cta"><span class="zero-product-card-cta-texto">Ver producto</span></span>
            </div>
        </a>
    </article>
</body>

</html>
