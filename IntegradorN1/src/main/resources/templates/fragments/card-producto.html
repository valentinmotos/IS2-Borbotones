<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
    <article th:fragment="card(imagen, nombre, precio, enOferta)" class="zero-product-card">
        <div class="image-wrap">
            <img th:src="${imagen}" th:alt="${nombre}">
        </div>
        <div class="zero-product-card-body">
            <span th:if="${enOferta}" class="badge badge-danger zero-offer-badge">Oferta</span>
            <h3 th:text="${nombre}">Producto</h3>
            <span class="price" th:text="${precio}">$0</span>
        </div>
    </article>

    <article th:fragment="cardCatalogo(producto)" class="zero-product-card">
        <div class="image-wrap">
            <img th:src="${producto.imagen != null ? '/imagen/' + producto.imagen : '/img/default-image.png'}"
                 th:alt="${producto.nombre}" loading="lazy">
        </div>
        <div class="zero-product-card-body">
            <span th:if="${producto.oferta}" class="badge badge-danger zero-offer-badge">Oferta</span>
            <h3 th:text="${producto.nombre}">Producto</h3>
            <p class="zero-product-meta" th:text="${'Talle ' + producto.talle}">Talle</p>
            <span class="price"
                  th:text="${'$' + #numbers.formatDecimal(producto.precio, 1, 'POINT', 0, 'COMMA')}">$0</span>
            <div class="mt-2">
                <form th:action="@{/cliente/carrito/agregar}" method="post" sec:authorize="hasRole('CLIENTE')">
                    <input type="hidden" name="idProducto" th:value="${producto.id}">
                    <input type="hidden" name="cantidad" value="1">
                    <button type="submit" class="btn btn-sm btn-dark btn-block">
                        <i class="fa fa-shopping-cart mr-1"></i> Agregar
                    </button>
                </form>
                <a th:href="@{/login}" class="btn btn-sm btn-outline-dark btn-block" sec:authorize="isAnonymous()">
                    <i class="fa fa-shopping-cart mr-1"></i> Agregar
                </a>
                <button type="button" class="btn btn-sm btn-secondary btn-block" disabled sec:authorize="hasAnyRole('JEFE', 'ADMINISTRATIVO')">
                    Solo clientes
                </button>
            </div>
        </div>
    </article>
</body>

</html>
