<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
    <form th:fragment="filtros(action)" th:attr="action=${action}" method="get" class="zero-filters">
        <div class="form-group">
            <label for="filtro-desde">Desde</label>
            <input id="filtro-desde" name="desde" type="date" class="form-control">
        </div>
        <div class="form-group">
            <label for="filtro-hasta">Hasta</label>
            <input id="filtro-hasta" name="hasta" type="date" class="form-control">
        </div>
        <div class="form-group">
            <label for="filtro-estado">Estado</label>
            <select id="filtro-estado" name="estado" class="form-control">
                <option value="">Todos los estados</option>
                <option value="activo">Activo</option>
                <option value="pendiente">Pendiente</option>
                <option value="anulado">Anulado</option>
            </select>
        </div>
        <button type="submit" class="zero-button primary">Buscar</button>
    </form>
    <!-- Filtro de listado por un solo select. opciones: Map valor → texto visible; la opción vacía muestra todos. -->
    <form th:fragment="filtroSelect(action, nombre, etiqueta, opciones, seleccionado)" th:action="@{${action}}"
          method="get" class="zero-filters">
        <div class="form-group">
            <label th:for="${'filtro-' + nombre}" th:text="${etiqueta}">Filtro</label>
            <select th:id="${'filtro-' + nombre}" th:name="${nombre}" class="form-control">
                <option value="">Todos</option>
                <option th:each="opcion : ${opciones}" th:value="${opcion.key}" th:text="${opcion.value}"
                        th:selected="${opcion.key == seleccionado}">Opción</option>
            </select>
        </div>
        <button type="submit" class="zero-button primary">Filtrar</button>
    </form>
</body>
</html>
