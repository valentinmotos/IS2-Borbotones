<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
    <form th:fragment="filtros(action)" th:attr="action=${action}" method="get" class="zero-filters">
        <div class="form-group">
            <label for="filtro-desde">Desde</label>
            <input id="filtro-desde" name="desde" type="date" class="form-control">
        </div>
        <div class="form-group">
            <label for="filtro-hasta">Hasta</label>
            <input id="filtro-hasta" name="hasta" type="date" class="form-control">
        </div>
        <div class="form-group">
            <label for="filtro-estado">Estado</label>
            <select id="filtro-estado" name="estado" class="form-control">
                <option value="">Todos los estados</option>
                <option value="activo">Activo</option>
                <option value="pendiente">Pendiente</option>
                <option value="anulado">Anulado</option>
            </select>
        </div>
        <button type="submit" class="zero-button primary">Buscar</button>
    </form>
    <!-- Filtro de listado por un solo select. opciones: Map valor → texto visible; la opción vacía muestra todos. -->
    <form th:fragment="filtroSelect(action, nombre, etiqueta, opciones, seleccionado)" th:action="@{${action}}"
          method="get" class="zero-filters">
        <div class="form-group">
            <label th:for="${'filtro-' + nombre}" th:text="${etiqueta}">Filtro</label>
            <select th:id="${'filtro-' + nombre}" th:name="${nombre}" class="form-control">
                <option value="">Todos</option>
                <option th:each="opcion : ${opciones}" th:value="${opcion.key}" th:text="${opcion.value}"
                        th:selected="${opcion.key == seleccionado}">Opción</option>
            </select>
        </div>
        <button type="submit" class="zero-button primary">Filtrar</button>
    </form>
    <!-- Campos sueltos para una barra con varios filtros: se incluyen dentro de un
         <form method="get" class="zero-filters zero-filters-amplio">, con los botones en un div.zero-filters-acciones. -->
    <div th:fragment="campoFiltroTexto(nombre, etiqueta, valor, ayuda)" class="form-group">
        <label th:for="${'filtro-' + nombre}" th:text="${etiqueta}">Buscar</label>
        <input th:id="${'filtro-' + nombre}" th:name="${nombre}" type="search" class="form-control"
               th:value="${valor}" th:placeholder="${ayuda}">
    </div>
    <!-- Fecha con el selector del navegador, por ejemplo para un rango desde / hasta. valor: LocalDate o null. -->
    <div th:fragment="campoFiltroFecha(nombre, etiqueta, valor)" class="form-group">
        <label th:for="${'filtro-' + nombre}" th:text="${etiqueta}">Fecha</label>
        <input th:id="${'filtro-' + nombre}" th:name="${nombre}" type="date" class="form-control" th:value="${valor}">
    </div>
    <!-- opciones: Map valor → texto visible; la opción vacía muestra todos. -->
    <div th:fragment="campoFiltroSelect(nombre, etiqueta, opciones, seleccionado)" class="form-group">
        <label th:for="${'filtro-' + nombre}" th:text="${etiqueta}">Filtro</label>
        <select th:id="${'filtro-' + nombre}" th:name="${nombre}" class="form-control">
            <option value="">Todos</option>
            <option th:each="opcion : ${opciones}" th:value="${opcion.key}" th:text="${opcion.value}"
                    th:selected="${opcion.key == seleccionado}">Opción</option>
        </select>
    </div>

    <!-- Filtros compartidos por la búsqueda y las páginas de categoría (E3-02). -->
    <aside th:fragment="catalogo(action, limpiarUrl, termino, precioMin, precioMax, talle, soloOfertas, orden)"
           class="zero-catalog-sidebar">
        <button class="zero-filter-toggle" type="button" data-toggle="collapse"
                data-target="#catalogo-filtros" aria-expanded="false" aria-controls="catalogo-filtros">
            <i class="fa fa-filter" aria-hidden="true"></i> Filtros y orden
        </button>
        <div id="catalogo-filtros" class="zero-filter-panel collapse d-md-block">
            <h2>Filtrar por</h2>
            <form th:action="${action}" method="get">
                <input th:if="${termino != null}" type="hidden" name="q" th:value="${termino}">
                <div class="zero-filter-group">
                    <label for="filtro-precio-min">Precio</label>
                    <div class="zero-price-range">
                        <input id="filtro-precio-min" class="form-control" type="number" name="precioMin"
                               min="0" step="0.01" placeholder="Mín." th:value="${precioMin}">
                        <input id="filtro-precio-max" class="form-control" type="number" name="precioMax"
                               min="0" step="0.01" placeholder="Máx." th:value="${precioMax}">
                    </div>
                </div>
                <div class="zero-filter-group">
                    <label for="filtro-talle">Talle</label>
                    <input id="filtro-talle" class="form-control" type="text" name="talle"
                           placeholder="Ej.: 42, M, XL" th:value="${talle}">
                </div>
                <div class="zero-filter-group">
                    <label for="filtro-orden">Ordenar</label>
                    <select id="filtro-orden" class="form-control" name="orden">
                        <option value="" th:selected="${orden == null or #strings.isEmpty(orden)}">Relevancia</option>
                        <option value="precio_asc" th:selected="${orden == 'precio_asc'}">Menor precio</option>
                        <option value="precio_desc" th:selected="${orden == 'precio_desc'}">Mayor precio</option>
                        <option value="nombre" th:selected="${orden == 'nombre'}">Nombre A-Z</option>
                        <option value="novedades" th:selected="${orden == 'novedades'}">Novedades</option>
                    </select>
                </div>
                <div class="custom-control custom-checkbox zero-filter-offers">
                    <input id="filtro-ofertas" class="custom-control-input" type="checkbox"
                           name="ofertas" value="true" th:checked="${soloOfertas}">
                    <label class="custom-control-label" for="filtro-ofertas">Solo ofertas</label>
                </div>
                <div class="zero-filter-actions">
                    <button type="submit" class="zero-button primary">Aplicar</button>
                    <a class="zero-button secondary" th:href="${limpiarUrl}">Limpiar</a>
                </div>
            </form>
        </div>
    </aside>
</body>
</html>
