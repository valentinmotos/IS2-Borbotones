<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
    <!-- Variante para ABM: cada registro expone id y nombre; las acciones son por fila. -->
    <div th:fragment="tablaNombre(registros, baseUrl)" class="table-responsive zero-table-wrap">
        <table class="table table-striped table-bordered mb-0">
            <thead><tr><th scope="col">Nombre</th><th scope="col">Acciones</th></tr></thead>
            <tbody>
                <tr th:if="${#lists.isEmpty(registros)}">
                    <td colspan="2" class="text-center text-muted py-4">No hay registros para mostrar.</td>
                </tr>
                <tr th:each="registro : ${registros}">
                    <td th:text="${registro.nombre}">Nombre</td>
                    <td class="zero-table-actions">
                        <a th:href="@{${baseUrl + '/' + registro.id + '/editar'}}" class="btn btn-sm btn-outline-primary"
                           th:attr="aria-label=${'Editar ' + registro.nombre}">Editar</a>
                        <button type="button" class="btn btn-sm btn-outline-danger" data-toggle="modal"
                                th:attr="data-target=${'#eliminar-' + registro.id},aria-label=${'Eliminar ' + registro.nombre}">Eliminar</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <!-- Variante para ABM con varias columnas: cada registro es un FilaTablaDTO (id, nombre y celdas). -->
    <div th:fragment="tablaRegistros(encabezados, registros, baseUrl)" class="table-responsive zero-table-wrap">
        <table class="table table-striped table-bordered mb-0">
            <thead>
                <tr>
                    <th scope="col" th:each="encabezado : ${encabezados}" th:text="${encabezado}">Columna</th>
                    <th scope="col">Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:if="${#lists.isEmpty(registros)}">
                    <td th:colspan="${#lists.size(encabezados) + 1}" class="text-center text-muted py-4">No hay registros para mostrar.</td>
                </tr>
                <tr th:each="registro : ${registros}">
                    <td th:each="celda : ${registro.celdas}" th:text="${celda}">Dato</td>
                    <td class="zero-table-actions">
                        <a th:href="@{${baseUrl + '/' + registro.id + '/editar'}}" class="btn btn-sm btn-outline-primary"
                           th:attr="aria-label=${'Editar ' + registro.nombre}">Editar</a>
                        <button type="button" class="btn btn-sm btn-outline-danger" data-toggle="modal"
                                th:attr="data-target=${'#eliminar-' + registro.id},aria-label=${'Eliminar ' + registro.nombre}">Eliminar</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <div th:fragment="tabla(encabezados, filas, verUrl, editarUrl, eliminarUrl)" class="table-responsive zero-table-wrap">
        <table class="table table-striped table-bordered mb-0">
            <thead>
                <tr>
                    <th th:each="encabezado : ${encabezados}" th:text="${encabezado}">Columna</th>
                    <th th:if="${verUrl != null or editarUrl != null or eliminarUrl != null}">Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:if="${#lists.isEmpty(filas)}">
                    <td th:colspan="${#lists.size(encabezados) + (verUrl != null or editarUrl != null or eliminarUrl != null ? 1 : 0)}" class="text-center text-muted py-4">No hay registros para mostrar.</td>
                </tr>
                <tr th:each="fila : ${filas}">
                    <td th:each="celda : ${fila}" th:text="${celda}">Dato</td>
                    <td th:if="${verUrl != null or editarUrl != null or eliminarUrl != null}" class="zero-table-actions">
                        <a th:if="${verUrl != null}" th:href="${verUrl}" class="btn btn-sm btn-outline-secondary">Ver</a>
                        <a th:if="${editarUrl != null}" th:href="${editarUrl}" class="btn btn-sm btn-outline-primary">Editar</a>
                        <a th:if="${eliminarUrl != null}" th:href="${eliminarUrl}" class="btn btn-sm btn-outline-danger">Eliminar</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
