version: '3'

services:
  zero-ecommerce:
    build: .
    mem_limit: 1g
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:sqlite:./data/zero.db?foreign_keys=on
      APP_URL_BASE: http://138.36.237.158:8080
      TZ: America/Argentina/Buenos_Aires
    volumes:
      - zero-data:/app/data
    restart: always

volumes:
  zero-data: