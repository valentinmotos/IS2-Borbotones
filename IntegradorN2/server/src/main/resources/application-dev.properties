# Perfil de desarrollo: PostgreSQL por variables de entorno (ver IntegradorN2/.env.example).
# Los valores por defecto sirven para el contenedor de PostgreSQL del README.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dulcemayor}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Hibernate crea y actualiza las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
