# nginx de los clientes React (E0-09): sirve el build de Vite y reenvía /api al servidor.
# El navegador ve un solo origen, así que no hace falta CORS.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # DNS interno de Docker: el nombre "backend" se resuelve en cada pedido,
    # así nginx arranca aunque el servidor todavía no esté listo.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://backend:8080;

    location /api/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Subida de imágenes (E1-05): hasta 2 MB; el servidor responde 413 con su JSON
        client_max_body_size 3m;
    }

    # Archivos con hash en el nombre: se pueden cachear para siempre
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Rutas de React Router: cualquier otra ruta devuelve la aplicación
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
