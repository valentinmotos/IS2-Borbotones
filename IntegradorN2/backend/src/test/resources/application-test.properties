# Perfil "test": base H2 en memoria en modo PostgreSQL, así "mvnw test" (y Jenkins) no necesitan un servidor de base.
spring.datasource.url=jdbc:h2:mem:dulcemayor;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
# Si una entidad no se puede mapear, el test falla en lugar de seguir con un esquema incompleto
spring.jpa.properties.hibernate.hbm2ddl.halt_on_error=true
# Las pruebas de envío manual no dependen del calendario del equipo.
app.newsletter.cron=-
