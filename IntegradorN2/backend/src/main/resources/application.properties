spring.application.name=dulce-mayor

# Perfil por defecto: desarrollo contra PostgreSQL (application-dev.properties)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.port=${SERVER_PORT:8080}

# JPA / Hibernate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Argentina/Mendoza

# Subida de archivos (imágenes de hasta 2 MB, E1-05)
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# API pura: sin recursos estáticos, así una ruta inexistente llega a GlobalExceptionHandler como 404 JSON
spring.web.resources.add-mappings=false

# Sin usuario en memoria con clave autogenerada: el login es JWT (E1-01)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# Nunca exponer stack traces en las respuestas
server.error.include-stacktrace=never
server.error.include-message=never

# Seguridad (E1-01). Valores vacíos = por defecto (ver JwtService y SecurityConfig):
# JWT_SECRET vacío genera una clave al azar en cada arranque (solo para desarrollo);
# JWT_EXPIRATION en segundos, 3600 si está vacío; CORS_ORIGINS separados por coma.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiracion-segundos=${JWT_EXPIRATION:}
app.cors.origenes=${CORS_ORIGINS:}

# Cotización del dólar (E1-08): DolarAPI y tiempo máximo de espera antes de usar la última guardada
app.cotizacion.url=${DOLARAPI_URL:https://dolarapi.com/v1/dolares/oficial}
app.cotizacion.timeout-ms=3000
app.cotizacion.intervalo-ms=3600000
