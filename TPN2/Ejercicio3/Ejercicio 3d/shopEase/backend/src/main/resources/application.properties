spring.application.name=shopease
spring.profiles.default=local
server.address=127.0.0.1
server.port=8080
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:shopease@example.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
jwt.auth.app=shopease
jwt.auth.expires_in=3600
stripe.secret=${STRIPE_SECRET:}
FILE_ZONE=${CDN_ZONE:}
FILE_UPLOAD_API_KEY=${CDN_KEY:}
FILE_UPLOAD_HOST_URL=${CDN_HOST:}
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.oauth.enabled=false
app.mail.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=INFO
