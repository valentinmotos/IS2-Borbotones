spring.application.name=ejercicio5e-autorizacion
spring.datasource.url=${AUTH_DB_URL:jdbc:h2:file:./data/identidades-oauth2}
spring.datasource.username=${AUTH_DB_USER:sa}
spring.datasource.password=${AUTH_DB_PASSWORD:}
spring.sql.init.mode=always
server.address=127.0.0.1
server.port=${AUTH_PORT:9000}
server.servlet.session.cookie.name=E5_AUTH_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie
server.error.include-stacktrace=never
app.oauth.issuer=${OAUTH_ISSUER:http://127.0.0.1:9000}
app.oauth.client-id=${OAUTH_CLIENT_ID:ejercicio5-cliente}
# Credenciales de demostracion local. Configurarlas en el entorno fuera del TP.
app.oauth.client-secret=${OAUTH_CLIENT_SECRET:cliente-local-demo-2026}
app.oauth.client-url=${CLIENT_URL:http://127.0.0.1:8080}
app.oauth.audience=${OAUTH_AUDIENCE:ejercicio5-api}
app.demo.password=${DEMO_USER_PASSWORD:Usuario123!}
app.demo.admin-password=${DEMO_ADMIN_PASSWORD:Admin123!}
