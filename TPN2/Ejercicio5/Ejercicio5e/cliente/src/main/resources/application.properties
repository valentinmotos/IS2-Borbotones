spring.application.name=mascotas-oauth2-cliente
server.address=127.0.0.1
server.port=${CLIENT_PORT:8080}
server.servlet.session.cookie.name=E5_CLIENT_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie
server.servlet.session.timeout=30m
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
server.error.include-message=never
server.error.include-stacktrace=never
app.api-url=${API_URL:http://127.0.0.1:8000}
app.oauth.issuer=${OAUTH_ISSUER:http://127.0.0.1:9000}
app.oauth.client-id=${OAUTH_CLIENT_ID:ejercicio5-cliente}
app.oauth.client-secret=${OAUTH_CLIENT_SECRET:cliente-local-demo-2026}
