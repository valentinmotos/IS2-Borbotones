spring.application.name=mascotas-oauth2-api
server.address=127.0.0.1
server.port=${API_PORT:8000}
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/mascotas-oauth2}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
server.error.include-message=never
server.error.include-stacktrace=never
app.oauth.issuer=${OAUTH_ISSUER:http://127.0.0.1:9000}
app.oauth.jwk-set-uri=${OAUTH_JWKS_URI:http://127.0.0.1:9000/oauth2/jwks}
app.oauth.audience=${OAUTH_AUDIENCE:ejercicio5-api}
