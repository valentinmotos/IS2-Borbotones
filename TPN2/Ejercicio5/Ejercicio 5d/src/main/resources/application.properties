spring.application.name=mascotas-jwt
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/mascotas-jwt}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
server.error.include-message=never
server.error.include-stacktrace=never
# Base64 de al menos 32 bytes aleatorios. Vacio genera una clave efimera al arrancar.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:900}
