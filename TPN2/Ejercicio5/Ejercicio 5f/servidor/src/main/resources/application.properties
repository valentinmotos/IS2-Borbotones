server.port=8000
spring.application.name=servidor
spring.datasource.url=jdbc:sqlite:servidor.sqlite
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
app.mail.enabled=${APP_MAIL_ENABLED:false}
app.mail.from=${APP_MAIL_FROM:}
app.scheduling.cron=${APP_SCHEDULING_CRON:0 0 8 * * *}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
app.jwt.secret=${JWT_SECRET:YmlibGlvdGVjYS1yZXN0LXNlY3JldG8tcGFyYS1maXJtYXItdG9rZW5zLWp3dC0yMDI2}
app.jwt.expiracion-minutos=${JWT_EXPIRACION_MINUTOS:60}
