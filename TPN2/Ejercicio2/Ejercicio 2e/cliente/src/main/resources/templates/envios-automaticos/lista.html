<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Envios automaticos</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>
<main>
    <h2>Envios automaticos</h2>
    <p><a class="button" th:href="@{/envios-automaticos/nuevo}">Nuevo envio automatico</a></p>
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Tipo</th>
            <th>Asunto</th>
            <th>Activo</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="envio : ${envios}">
            <td th:text="${envio.id}"></td>
            <td th:text="${envio.nombre}"></td>
            <td th:text="${envio.tipo}"></td>
            <td th:text="${envio.asunto}"></td>
            <td th:text="${envio.activo ? 'Si' : 'No'}"></td>
            <td class="actions">
                <a class="button" th:href="@{/envios-automaticos/editar/{id}(id=${envio.id})}">Editar</a>
                <a class="button danger" th:href="@{/envios-automaticos/eliminar/{id}(id=${envio.id})}">Eliminar</a>
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
