<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clima</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="d-flex flex-column min-vh-100">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand"><i class="bi bi-cloud-sun"></i> Clima App</span>
        <span class="navbar-text small">Datos de OpenWeatherMap</span>
    </div>
</nav>

<header class="hero text-white text-center py-5">
    <div class="container">
        <h1 class="display-5 fw-bold">Consultá el clima</h1>
        <p class="lead">Ingresá una ciudad para ver el clima actual</p>
        <form id="formulario" class="row g-2 justify-content-center mt-3">
            <div class="col-12 col-md-5">
                <input id="ciudad" class="form-control form-control-lg" placeholder="Ej: Mendoza" required>
            </div>
            <div class="col-12 col-md-auto">
                <button class="btn btn-warning btn-lg w-100" type="submit"><i class="bi bi-search"></i> Buscar</button>
            </div>
        </form>
    </div>
</header>

<main class="container py-5 flex-grow-1">
    <div id="error" class="alert alert-danger d-none"></div>

    <div id="resultado" class="card shadow mx-auto d-none" style="max-width: 32rem;">
        <div class="card-body text-center">
            <h2 class="card-title" id="nombre"></h2>
            <img id="icono" alt="icono del clima">
            <p class="display-4 fw-bold mb-0" id="temperatura"></p>
            <p class="text-capitalize text-muted" id="descripcion"></p>
            <div class="row text-center mt-3">
                <div class="col">
                    <i class="bi bi-thermometer-half fs-4"></i>
                    <p class="mb-0 small text-muted">Sensación</p>
                    <p class="fw-bold" id="sensacion"></p>
                </div>
                <div class="col">
                    <i class="bi bi-droplet fs-4"></i>
                    <p class="mb-0 small text-muted">Humedad</p>
                    <p class="fw-bold" id="humedad"></p>
                </div>
                <div class="col">
                    <i class="bi bi-wind fs-4"></i>
                    <p class="mb-0 small text-muted">Viento</p>
                    <p class="fw-bold" id="viento"></p>
                </div>
            </div>
        </div>
    </div>
</main>

<footer class="bg-dark text-white-50 text-center py-3">
    IS2 - TPN2 - Ejercicio 1e
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
