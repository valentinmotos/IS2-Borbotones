<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="modal(id, titulo, mensaje, actionUrl)" class="modal fade" th:id="${id}" tabindex="-1" role="dialog" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content zero-modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" th:text="${titulo}">Confirmar acción</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Cerrar"><span aria-hidden="true">&times;</span></button>
                </div>
                <div class="modal-body" th:text="${mensaje}">¿Querés confirmar esta acción?</div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light" data-dismiss="modal">Cancelar</button>
                    <form th:action="@{${actionUrl}}" method="post">
                        <button type="submit" class="btn btn-danger">Confirmar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
