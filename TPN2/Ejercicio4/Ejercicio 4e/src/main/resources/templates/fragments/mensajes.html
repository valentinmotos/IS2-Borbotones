<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="mensajes" th:if="${error != null or exito != null}" class="mb-4">
        <div th:if="${error != null and !#strings.isEmpty(error)}" class="alert alert-danger mb-2" role="alert">
            <span th:text="${error}">Se produjo un error.</span>
        </div>
        <div th:if="${exito != null and !#strings.isEmpty(exito)}" class="alert alert-success mb-0 d-flex justify-content-between align-items-center" role="alert">
            <div>
                <span th:utext="${exito}">Operación realizada correctamente.</span>
            </div>
            <a th:if="${verCarritoLink != null}" th:href="@{/cliente/carrito}" class="btn btn-sm btn-outline-success font-weight-bold ml-3">
                <i class="fa fa-shopping-cart mr-1"></i> Ver carrito
            </a>
        </div>
    </div>
</body>

</html>
