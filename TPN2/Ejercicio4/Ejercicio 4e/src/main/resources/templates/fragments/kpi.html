<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
    <article th:fragment="kpi(titulo, valor, descripcion, icono)" class="zero-kpi">
        <div class="zero-kpi-icon" th:if="${icono != null}"><i th:class="${icono}" aria-hidden="true"></i></div>
        <div>
            <p class="zero-kpi-title" th:text="${titulo}">Indicador</p>
            <strong class="zero-kpi-value" th:text="${valor}">0</strong>
            <p class="zero-kpi-description" th:if="${descripcion != null}" th:text="${descripcion}">Información complementaria</p>
        </div>
    </article>
    <!-- Mismo indicador, pero como link: por ejemplo, una tarjeta que filtra un listado. activo la resalta. -->
    <a th:fragment="kpiEnlace(titulo, valor, descripcion, icono, url, activo)" th:href="@{${url}}"
       class="zero-kpi zero-kpi-link" th:classappend="${activo} ? 'active'" th:attr="aria-current=${activo ? 'true' : null}">
        <div class="zero-kpi-icon" th:if="${icono != null}"><i th:class="${icono}" aria-hidden="true"></i></div>
        <div>
            <p class="zero-kpi-title" th:text="${titulo}">Indicador</p>
            <strong class="zero-kpi-value" th:text="${valor}">0</strong>
            <p class="zero-kpi-description" th:if="${descripcion != null}" th:text="${descripcion}">Información complementaria</p>
        </div>
    </a>
</body>
</html>
