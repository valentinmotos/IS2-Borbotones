<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{email/base}">
<body>
    <!--
      Variables (NotificacionCompraService.notificarCambioEstado): nombreCliente, identificador, estado (texto visible),
      mensajeEstado y urlSeguimiento (URL absoluta).
    -->
    <div layout:fragment="contenido">
        <p style="margin: 0 0 8px 0; color: #555555;" th:text="|¡Hola, ${nombreCliente}!|">¡Hola, Cliente!</p>
        <h1 style="margin: 0 0 16px 0; font-size: 22px; line-height: 1.3; color: #0b0b0b;">Tu compra cambió de estado</h1>
        <p style="margin: 0 0 20px 0;">
            Tu compra <strong th:text="${identificador}">ORD-0000</strong> ahora está en:
        </p>
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin: 0 auto 20px auto;">
            <tr>
                <td align="center" style="background-color: #f1f1f1; border: 2px solid #d7ff3f; border-radius: 12px; padding: 12px 28px; font-size: 20px; font-weight: bold; color: #0b0b0b;"
                    th:text="${estado}">Pendiente de envío</td>
            </tr>
        </table>
        <p style="margin: 0 0 24px 0; text-align: center;" th:text="${mensajeEstado}">Mensaje del estado.</p>
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin: 0 auto 16px auto;">
            <tr>
                <td align="center" style="background-color: #0b0b0b; border-radius: 999px;">
                    <a th:href="${urlSeguimiento}" href="#"
                       style="display: inline-block; padding: 14px 28px; font-size: 14px; font-weight: bold; letter-spacing: 1px; text-transform: uppercase; color: #ffffff; text-decoration: none;">Seguir mi compra</a>
                </td>
            </tr>
        </table>
    </div>
</body>
</html>
