<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin}">
<body>
    <div layout:fragment="breadcrumb">
        <span>Abastecimiento</span><span class="breadcrumb-separator">/</span><span>Proveedores</span>
    </div>
    <div layout:fragment="content">
        <div th:replace="~{fragments/mensajes :: mensajes}"></div>
        <div class="zero-panel">
            <form th:action="@{/admin/proveedores}" method="get" class="zero-filters mb-4">
                <div th:replace="~{fragments/filtros :: campoFiltroTexto('buscar', 'Buscar', ${buscar}, 'Razón social')}"></div>
                <div class="zero-filters-acciones">
                    <button type="submit" class="zero-button primary">Buscar</button>
                    <a th:href="@{/admin/proveedores}" class="zero-button secondary">Limpiar</a>
                </div>
            </form>
            <div class="d-flex flex-wrap justify-content-between align-items-center mb-3">
                <a th:href="@{/admin/proveedores/nuevo}" class="zero-button primary">Nuevo proveedor</a>
                <span class="text-muted"
                      th:text="${totalProveedores == 1 ? '1 proveedor' : totalProveedores + ' proveedores'}">0 proveedores</span>
            </div>
            <!-- Misma estructura que fragments/tabla :: tablaRegistros, con celdas de varias líneas (correos y
                 teléfonos) y el botón de WhatsApp, que el fragment no soporta. -->
            <div class="table-responsive zero-table-wrap">
                <table class="table table-striped table-bordered mb-0">
                    <thead>
                        <tr>
                            <th scope="col">Razón social</th>
                            <th scope="col">Correos</th>
                            <th scope="col">Teléfonos</th>
                            <th scope="col">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(proveedores)}">
                            <td colspan="4" class="text-center text-muted py-4">No hay registros para mostrar.</td>
                        </tr>
                        <tr th:each="proveedor : ${proveedores}"
                            th:with="celular=${proveedor.buscarCelularActivo().orElse(null)}">
                            <td th:text="${proveedor.razonSocial}">Razón social</td>
                            <td>
                                <div th:each="correo : ${proveedor.listarCorreoActivo()}">
                                    <span th:text="${correo.email}">correo@proveedor.com</span>
                                    <small th:if="${correo.observacion != null}" class="text-muted"
                                           th:text="|(${correo.observacion})|">(Ventas)</small>
                                </div>
                            </td>
                            <td>
                                <div th:each="telefono : ${proveedor.listarTelefonoActivo()}">
                                    <span class="badge badge-secondary" th:text="${telefono.tipoTelefono.descripcion}">Celular</span>
                                    <span th:text="${telefono.telefono}">5492614123456</span>
                                    <small th:if="${telefono.observacion != null}" class="text-muted"
                                           th:text="|(${telefono.observacion})|">(Ventas)</small>
                                </div>
                            </td>
                            <td class="zero-table-actions">
                                <a th:if="${celular != null}" th:href="|https://wa.me/${celular.telefono}|"
                                   target="_blank" rel="noopener noreferrer" class="btn btn-sm zero-btn-whatsapp"
                                   th:attr="aria-label=${'WhatsApp a ' + proveedor.razonSocial}">
                                    <i class="fa fa-whatsapp" aria-hidden="true"></i> WhatsApp
                                </a>
                                <a th:href="@{'/admin/proveedores/' + ${proveedor.id} + '/editar'}" class="btn btn-sm btn-outline-primary"
                                   th:attr="aria-label=${'Editar ' + proveedor.razonSocial}">Editar</a>
                                <button type="button" class="btn btn-sm btn-outline-danger" data-toggle="modal"
                                        th:attr="data-target=${'#eliminar-' + proveedor.id},aria-label=${'Eliminar ' + proveedor.razonSocial}">Eliminar</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <th:block th:each="proveedor : ${proveedores}">
            <div th:replace="~{fragments/modal-confirmar :: modal(${'eliminar-' + proveedor.id}, 'Eliminar proveedor',
                 ${'¿Querés eliminar el proveedor ' + proveedor.razonSocial + '? También se dan de baja sus contactos.'},
                 ${'/admin/proveedores/' + proveedor.id + '/eliminar'})}"></div>
        </th:block>
    </div>
</body>
</html>
