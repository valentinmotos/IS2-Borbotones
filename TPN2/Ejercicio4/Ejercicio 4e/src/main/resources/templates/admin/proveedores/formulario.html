<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin}">
<body>
    <div layout:fragment="breadcrumb">
        <span>Abastecimiento</span><span class="breadcrumb-separator">/</span>
        <a th:href="@{/admin/proveedores}">Proveedores</a><span class="breadcrumb-separator">/</span>
        <span th:text="${id == null ? 'Alta' : 'Edición'}">Alta</span>
    </div>
    <div layout:fragment="content">
        <div th:replace="~{fragments/mensajes :: mensajes}"></div>
        <form th:action="@{${id == null ? '/admin/proveedores' : '/admin/proveedores/' + id + '/editar'}}"
              method="post" class="zero-form">
            <div class="zero-panel mb-4">
                <h2>Datos</h2>
                <div th:replace="~{fragments/formulario :: campoTexto('razonSocial', 'Razón social', ${proveedorForm.razonSocial}, true)}"></div>
            </div>
            <div class="zero-panel">
                <h2>Contactos</h2>
                <p class="text-muted">
                    Tiene que haber al menos un correo electrónico y un celular para WhatsApp. El celular va en formato
                    internacional, con código de país y de área: <code>5492614123456</code>.
                </p>
                <div class="table-responsive zero-table-wrap">
                    <table class="table table-bordered mb-0 zero-tabla-contactos">
                        <thead>
                            <tr>
                                <th scope="col">Tipo</th>
                                <th scope="col">Valor</th>
                                <th scope="col">Ámbito</th>
                                <th scope="col">Observación</th>
                                <th scope="col">Acciones</th>
                            </tr>
                        </thead>
                        <tbody data-contactos>
                            <th:block th:each="contacto, stat : ${proveedorForm.contactos}">
                                <tr th:replace="~{admin/proveedores/formulario :: filaContacto(${contacto}, ${stat.index})}"></tr>
                            </th:block>
                        </tbody>
                    </table>
                </div>
                <div class="mt-3">
                    <button type="button" class="zero-button secondary" data-agregar-contacto>Agregar contacto</button>
                </div>
                <div th:replace="~{fragments/formulario :: acciones('/admin/proveedores')}"></div>
            </div>
        </form>

        <!-- Fila vacía que clona static/js/proveedor-contactos.js: INDICE se reemplaza por el número de fila. -->
        <template id="plantilla-contacto">
            <tr th:fragment="filaContacto(contacto, indice)" class="fila-contacto"
                th:with="i=${indice != null ? indice : 'INDICE'}">
                <td>
                    <input type="hidden" th:name="|contactos[${i}].id|" th:value="${contacto?.id}">
                    <select th:name="|contactos[${i}].tipo|" class="form-control" aria-label="Tipo de contacto"
                            data-tipo-medio required>
                        <option th:each="opcion : ${tiposMedio}" th:value="${opcion.key}" th:text="${opcion.value}"
                                th:selected="${opcion.key == contacto?.tipo}">Tipo</option>
                    </select>
                </td>
                <td>
                    <input type="text" th:name="|contactos[${i}].valor|" class="form-control" th:value="${contacto?.valor}"
                           aria-label="Correo o teléfono" data-valor-contacto required>
                </td>
                <td>
                    <select th:name="|contactos[${i}].tipoContacto|" class="form-control" aria-label="Ámbito" required>
                        <option th:each="opcion : ${tiposContacto}" th:value="${opcion.key}" th:text="${opcion.value}"
                                th:selected="${opcion.key == contacto?.tipoContacto}">Ámbito</option>
                    </select>
                </td>
                <td>
                    <input type="text" th:name="|contactos[${i}].observacion|" class="form-control"
                           th:value="${contacto?.observacion}" aria-label="Observación" placeholder="Ej: Ventas">
                </td>
                <td class="zero-table-actions">
                    <button type="button" class="btn btn-sm btn-outline-danger" data-quitar-contacto>Quitar</button>
                </td>
            </tr>
        </template>
    </div>
    <th:block layout:fragment="scripts">
        <script th:src="@{/js/proveedor-contactos.js}"></script>
    </th:block>
</body>
</html>
