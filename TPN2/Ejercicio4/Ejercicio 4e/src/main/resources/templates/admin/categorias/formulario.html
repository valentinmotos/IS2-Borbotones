<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin}">
<body>
    <div layout:fragment="breadcrumb">
        <a th:href="@{/admin/categorias}">Categorías</a><span class="breadcrumb-separator">/</span>
        <span th:text="${id == null ? 'Alta' : 'Edición'}">Alta</span>
    </div>
    <div layout:fragment="content">
        <div th:replace="~{fragments/mensajes :: mensajes}"></div>
        <div class="zero-panel">
            <form th:replace="~{fragments/formulario :: formularioNombre(
                  ${id == null ? '/admin/categorias' : '/admin/categorias/' + id + '/editar'},
                  ${categoriaForm.nombre}, '/admin/categorias')}"></form>
        </div>
    </div>
</body>
</html>
