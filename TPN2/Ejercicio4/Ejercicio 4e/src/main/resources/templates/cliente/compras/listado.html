<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/publico}">
<head>
    <title th:text="${pageTitle}">Zero | Mis compras</title>
</head>
<body>
    <div layout:fragment="content">
        <section class="zero-section">
            <div class="container">
                <nav class="zero-breadcrumb" aria-label="Navegación">
                    <a th:href="@{/}">Inicio</a>
                    <span>/</span>
                    <a th:href="@{/cliente}">Mi cuenta</a>
                    <span>/</span>
                    <strong>Mis compras</strong>
                </nav>

                <div class="zero-section-heading mb-4">
                    <div>
                        <span class="zero-kicker">Mi cuenta</span>
                        <h1>Mis compras</h1>
                    </div>
                </div>

                <div th:replace="~{fragments/mensajes :: mensajes}"></div>

                <div th:if="${#lists.isEmpty(compras)}" class="zero-empty-state">
                    <i class="fa fa-shopping-bag" aria-hidden="true"></i>
                    <h2>Todavía no hiciste compras</h2>
                    <p class="text-muted">Cuando confirmes un carrito, vas a poder seguir tu pedido desde acá.</p>
                    <a th:href="@{/}" class="zero-button primary">Ver productos</a>
                </div>

                <div th:unless="${#lists.isEmpty(compras)}" class="zero-panel">
                    <div class="table-responsive zero-table-wrap">
                        <table class="table table-striped table-bordered mb-0">
                            <thead>
                                <tr>
                                    <th scope="col">Número</th>
                                    <th scope="col">Fecha</th>
                                    <th scope="col">Ítems</th>
                                    <th scope="col">Total</th>
                                    <th scope="col">Forma de pago</th>
                                    <th scope="col">Estado</th>
                                    <th scope="col">Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="compra : ${compras}">
                                    <td th:text="${compra.numero}">ORD-0001</td>
                                    <td th:text="${compra.fecha != null ? #temporals.format(compra.fecha, 'dd/MM/yyyy') : '-'}">01/01/2026</td>
                                    <td class="text-right" th:text="${compra.cantidadItems}">1</td>
                                    <td class="text-right" th:text="${'$' + #numbers.formatDecimal(compra.total, 1, 'POINT', 2, 'COMMA')}">$0,00</td>
                                    <td th:text="${compra.formaDePago != null ? compra.formaDePago : '-'}">Efectivo</td>
                                    <td><span th:replace="~{fragments/badge-estado :: badge(${compra.estado})}"></span></td>
                                    <td class="zero-table-actions">
                                        <a th:href="@{'/cliente/compras/' + ${compra.id}}" class="btn btn-sm btn-outline-primary"
                                           th:attr="aria-label=${'Ver compra ' + compra.numero}">Ver</a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>
    </div>
</body>
</html>
