<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/publico}">
<head>
    <title>404 - Página no encontrada</title>
</head>
<body>
    <div layout:fragment="content">
        <section class="zero-section">
            <div class="container">
                <div class="zero-panel" style="max-width: 760px; margin: 0 auto; text-align: center; padding: 4rem 2rem; background: #fff; border-radius: 24px;">
                    <div class="zero-kicker">Error 404</div>
                    <h1 style="font-size: clamp(2.5rem, 5vw, 4rem); margin-bottom: 1rem;">Página no encontrada</h1>
                    <p style="font-size: 1.05rem; color: #666; margin-bottom: 2rem;">La ruta solicitada no existe o fue movida en Zero.</p>
                    <a th:href="@{/}" class="zero-button primary">Volver al inicio</a>
                </div>
            </div>
        </section>
    </div>
</body>
</html>
