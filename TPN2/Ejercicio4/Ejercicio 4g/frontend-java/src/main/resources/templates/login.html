<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ingresar · Consultorio</title><link rel="stylesheet" href="/vendor/flatly.min.css"><link rel="stylesheet" href="/css/consultorio.css"></head>
