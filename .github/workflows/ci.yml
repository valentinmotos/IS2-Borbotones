name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Ejecutar tests con Maven
        run: |
          chmod +x backend/mvnw
          ./backend/mvnw -B -f backend/pom.xml test

      - name: Construir imagen del backend
        run: docker build -t dulcemayor-backend:${{ github.run_number }} ./backend

      - name: Construir imagen del cliente admin
        run: docker build -t dulcemayor-client-admin:${{ github.run_number }} -f client-admin/Dockerfile .

      - name: Construir imagen del cliente público
        run: docker build -t dulcemayor-client-public:${{ github.run_number }} -f client-public/Dockerfile .
