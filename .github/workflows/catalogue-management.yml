name: Catalogue Management CI

on:
  push:
    branches: [ "main" ]
    paths:
      - "TPN2/Ejercicio6/Ejercicio 6e/CatalogueManagement/**"
      - ".github/workflows/catalogue-management.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "TPN2/Ejercicio6/Ejercicio 6e/CatalogueManagement/**"
      - ".github/workflows/catalogue-management.yml"
  workflow_dispatch:

env:
  PROJECT_DIR: TPN2/Ejercicio6/Ejercicio 6e/CatalogueManagement

defaults:
  run:
    working-directory: TPN2/Ejercicio6/Ejercicio 6e/CatalogueManagement

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven
          cache-dependency-path: ${{ env.PROJECT_DIR }}/pom.xml

      - name: Ejecutar tests con Maven
        run: mvn -B test

      - name: Subir resultados de los tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ env.PROJECT_DIR }}/target/surefire-reports/

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven
          cache-dependency-path: ${{ env.PROJECT_DIR }}/pom.xml

      - name: Build con Maven
        run: mvn -B clean verify -DskipTests

      - name: Subir el JAR generado
        uses: actions/upload-artifact@v4
        with:
          name: catalogue-management-jar
          path: ${{ env.PROJECT_DIR }}/target/*.jar
